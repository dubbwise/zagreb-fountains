<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Find the nearest public drinking fountain in Zagreb." />
    <meta name="theme-color" content="#0161b0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Zagreb Fountains</title>
    <script>
      // Mirrors apply() in src/settings.ts — keep the two in step. Runs before
      // first paint so dark-mode visitors never see a white flash.
      var storedTheme = null;
      try {
        storedTheme = localStorage.getItem("zf.theme");
      } catch (error) {
        /* storage blocked: fall through to the light default below */
      }
      // Light unless explicitly stored as dark. The OS preference is not
      // consulted — mirrors getTheme() in src/settings.ts, keep the two in step.
      var dark = storedTheme === "dark";
      document.documentElement.classList.toggle("dark", dark);
      var themeMeta = document.querySelector('meta[name="theme-color"]');
      if (themeMeta) themeMeta.setAttribute("content", dark ? "#292929" : "#0161b0");
      var storedLanguage = null;
      try {
        storedLanguage = localStorage.getItem("zf.lang");
      } catch (error) {
        /* storage blocked: keep the document language as authored */
      }
      if (storedLanguage === "hr" || storedLanguage === "en") document.documentElement.lang = storedLanguage;
    </script>
  </head>
  <body class="h-dvh overflow-hidden bg-surface text-body-strong antialiased">
    <div id="map" class="absolute inset-0"></div>
    <div
      id="intro"
      class="absolute inset-0 z-[1500] overflow-y-auto bg-surface/80"
      role="dialog"
      aria-modal="true"
      aria-labelledby="intro-title"
    ></div>
    <section
      id="card"
      class="absolute inset-x-0 bottom-0 z-[1000] px-3 pt-3 pb-[max(0.75rem,env(safe-area-inset-bottom))]"
      aria-live="polite"
    ></section>
    <div id="fatal" class="absolute inset-0 z-[2000] hidden" role="alert"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
