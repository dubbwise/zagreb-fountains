<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Find the nearest public drinking fountain in Zagreb." />
    <meta name="theme-color" content="#0369a1" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>"
    />
    <title>Zagreb Fountains</title>
    <script>
      // Mirrors apply() in src/settings.ts — keep the two in step. Runs before
      // first paint so dark-mode visitors never see a white flash.
      var storedTheme = null;
      try {
        storedTheme = localStorage.getItem("zf.theme");
      } catch (error) {
        /* storage blocked: fall through to the system preference below */
      }
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      var dark = storedTheme === "dark" || (storedTheme !== "light" && prefersDark);
      document.documentElement.classList.toggle("dark", dark);
      var themeMeta = document.querySelector('meta[name="theme-color"]');
      if (themeMeta) themeMeta.setAttribute("content", dark ? "#020617" : "#0369a1");
      var storedLanguage = null;
      try {
        storedLanguage = localStorage.getItem("zf.lang");
      } catch (error) {
        /* storage blocked: keep the document language as authored */
      }
      if (storedLanguage === "hr" || storedLanguage === "en") document.documentElement.lang = storedLanguage;
    </script>
  </head>
  <body class="h-dvh overflow-hidden bg-slate-100 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
    <div id="map" class="absolute inset-0"></div>
    <div id="intro" class="absolute inset-0 z-[1500] overflow-y-auto bg-slate-100 dark:bg-slate-950" role="dialog" aria-modal="true"></div>
    <section
      id="card"
      class="absolute inset-x-0 bottom-0 z-[1000] px-3 pt-3 pb-[max(0.75rem,env(safe-area-inset-bottom))]"
      aria-live="polite"
    ></section>
    <div id="fatal" class="absolute inset-0 z-[2000] hidden" role="alert"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
